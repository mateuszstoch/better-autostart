[package]
name = "better-autostart"
version = "0.1.0"
description = "Better Windows Autostart Manager"
authors = ["Matis"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "better_autostart_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
winreg = "0.52"
